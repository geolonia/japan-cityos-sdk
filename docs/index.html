<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityOS 日本</title>
  <style type="text/css">
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .popup-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed
    }

    .popup-table th,
    .popup-table td {
      border: 1px solid #ddd;
      text-align: left;
      padding: 8px;
      overflow-wrap: break-word;
    }

    .popup-table th {
      background-color: #f2f2f2;
    }

    .maplibregl-popup-content {
      overflow: auto;
    }

    #sidebar {
      position: absolute;
      z-index: 10;
      top: 10px;
      left: 10px;
      width: 260px;
      height: calc(100% - 20px);
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <!-- サイドバー全体をまとめるdivを追加 -->
  <div 
    id="sidebar"
  >
    <div style="margin-bottom:12px;">
      <label for="pref-select" style="font-weight:bold;">都道府県</label>
      <select id="pref-select" style="width:100%;margin-bottom:8px;"></select>
      <label for="city-select" style="font-weight:bold;">市区町村</label>
      <select id="city-select" style="width:100%;"></select>
    </div>
    <div style="margin-bottom:12px;">
      <p style="font-weight:bold;">背景地図</p>
      <select id="style-select" style="width:100%;">
        <option value="https://basic-v1-background-only.pages.dev/style.json">basic</option>
        <option value="https://geoloniamaps.github.io/gsi/style.json">標準</option>
        <option value="https://smartmap.styles.geoloniamaps.com/style.json">GSI</option>
        <option value="https://smartcity-satellite.styles.geoloniamaps.com/style.json">衛星写真</option>
        <option value="https://chizubouken-lab.pages.dev/style.json">ゲーム風</option>
      </select>
    </div>
    <div style="margin-bottom:12px;">
      <input type="checkbox" id="poi-checkbox" checked>
      <label for="poi-checkbox">OSM：レストラン</label>
    </div>
    <div style="margin-bottom:12px;">
      <input type="checkbox" id="poi-checkbox2" checked>
      <label for="poi-checkbox2">OSM：鉄道</label>
    </div>
    <div style="margin-bottom:12px;">
      <input type="checkbox" id="poi-checkbox3" checked>
      <label for="poi-checkbox3">OSM：学校</label>
    </div>
    <div style="margin-bottom:12px;">
      <select id="school-sprite-select" style="width:100%;">
        <option value="basic" default>学校を'basic'スプライトで表示</option>
        <option value="chizubouken-lab">学校を'chizubouken-lab'スプライトで表示</option>
      </select>
    </div>
    <div style="margin-bottom:12px;">
      <input type="checkbox" id="poi-checkbox4" checked>
      <label for="poi-checkbox4">OSM：zoo</label>
    </div>
    <div style="margin-bottom:12px;">
      <select id="zoo-icon-select" style="width:100%;">
        <option value="zoo" default>動物園を'動物園'アイコンで表示</option>
        <option value="castle">動物園を'城'アイコンで表示</option>
        <option value="nonexistent">動物園を存在しないアイコンで表示（アイコン切り替わりません）</option>
      </select>
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">ハザードマップ</p>
      <div id="hazardmap-checkbox-list"></div>
    </div>
    <div style="background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">国土数値情報</p>
      <div id="nlni-checkbox-list"></div>
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">鳥取県スマートシティ</p>
      <input type="text" id="tottori-search" placeholder="レイヤー検索..." style="width:100%;margin-bottom:4px;box-sizing:border-box;">
      <div id="tottori-checkbox-list" style="max-height:200px;overflow-y:auto;"></div>
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">setSymbolIconSize</p>
      <label>icon-size: <span id="symbol-size-val">0.5</span></label>
      <input type="range" id="symbol-size" min="0.1" max="3" step="0.1" value="0.5" style="width:100%;">
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">setCircleStyle</p>
      <label>color</label>
      <input type="color" id="circle-color" value="#FF0000" style="width:100%;">
      <label>radius: <span id="circle-radius-val">6</span></label>
      <input type="range" id="circle-radius" min="1" max="30" step="1" value="6" style="width:100%;">
      <label>strokeColor</label>
      <input type="color" id="circle-stroke-color" value="#FF0000" style="width:100%;">
      <label>strokeWidth: <span id="circle-stroke-width-val">1</span></label>
      <input type="range" id="circle-stroke-width" min="0" max="10" step="1" value="1" style="width:100%;">
      <label>opacity: <span id="circle-opacity-val">0.8</span></label>
      <input type="range" id="circle-opacity" min="0" max="1" step="0.1" value="0.8" style="width:100%;">
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">setFillStyle</p>
      <label>color</label>
      <input type="color" id="fill-color" value="#00FF00" style="width:100%;">
      <label>opacity: <span id="fill-opacity-val">0.5</span></label>
      <input type="range" id="fill-opacity" min="0" max="1" step="0.1" value="0.5" style="width:100%;">
      <label>outlineColor</label>
      <input type="color" id="fill-outline-color" value="#00FF00" style="width:100%;">
    </div>
    <div style="margin-bottom:12px;background:#fff;padding:5px;border-radius:5px;">
      <p style="font-weight:bold;">setLineStyle</p>
      <label>color</label>
      <input type="color" id="line-color" value="#0000FF" style="width:100%;">
      <label>width: <span id="line-width-val">3</span></label>
      <input type="range" id="line-width" min="1" max="20" step="1" value="3" style="width:100%;">
      <label>opacity: <span id="line-opacity-val">1.0</span></label>
      <input type="range" id="line-opacity" min="0" max="1" step="0.1" value="1.0" style="width:100%;">
    </div>
    <div style="margin-bottom:12px;">
      <button id="toggle-3d-btn" style="width:100%;padding:8px 0;">3D地形表示 ON</button>
    </div>
    <div style="margin-bottom:12px;">
      <button id="get-elevation-btn" style="width:100%;padding:8px 0;">現在地の標高を取得</button>
    </div>
    <div style="margin-bottom:12px;">
      <button id="show-icons-btn" style="width:100%;padding:8px 0;">アイコン一覧表示</button>
    </div>
    <div id="icon-popup" style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border:1px solid #ccc;padding:16px;border-radius:8px;max-width:90vw;max-height:70vh;overflow:auto;"></div>
  </div>
  <div id="map"></div>
  <script src="./index.js"></script>
  <script type="application/javascript">
    // 都道府県・市区町村プルダウン初期化
    async function initPrefCityDropdown() {
      const prefSelect = document.getElementById('pref-select');
      const citySelect = document.getElementById('city-select');
      // 都道府県取得
      const prefs = await geolonia.japan.Map.fetchPrefNames();
      prefSelect.innerHTML = prefs.map(pref => `<option value="${pref}">${pref}</option>`).join('');
      // 初期選択の市区町村表示
      const firstPref = prefs[0];
      const cities = await geolonia.japan.Map.fetchCityNames(firstPref);
      citySelect.innerHTML = cities.map(city => `<option value="${city}">${city}</option>`).join('');
      // 都道府県変更時のイベント
      prefSelect.addEventListener('change', async function(e) {
        const prefName = e.target.value;
        const cities = await geolonia.japan.Map.fetchCityNames(prefName);
        console.log('選択された都道府県:', prefName, cities);
        citySelect.innerHTML = cities.map(city => `<option value="${city}">${city}</option>`).join('');
      });
    }

    const geojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: {
            name: 'やんばるHotCafe',
            price: '¥1,000〜2,000',
            category: 'レストラン'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98946107360247, 26.67593043421343]
          }
        },
        {
          type: 'Feature',
          properties: {
            name: '森の巣箱',
            price: '¥1,000〜2,000',
            category: 'カフェ・喫茶'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98748696778947, 26.661740999954894]
          }
        }
      ]
    }

    const circleGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '那覇空港' },
          geometry: { type: 'Point', coordinates: [127.6461, 26.2076] }
        },
        {
          type: 'Feature',
          properties: { name: '首里城' },
          geometry: { type: 'Point', coordinates: [127.7195, 26.2172] }
        },
        {
          type: 'Feature',
          properties: { name: '美ら海水族館' },
          geometry: { type: 'Point', coordinates: [127.8779, 26.6944] }
        },
        {
          type: 'Feature',
          properties: { name: '万座毛' },
          geometry: { type: 'Point', coordinates: [127.8547, 26.5041] }
        }
      ]
    }

    const polygonGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '那覇エリア' },
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [127.65, 26.20],
              [127.72, 26.20],
              [127.72, 26.25],
              [127.65, 26.25],
              [127.65, 26.20]
            ]]
          }
        },
        {
          type: 'Feature',
          properties: { name: '名護エリア' },
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [127.95, 26.55],
              [128.02, 26.55],
              [128.02, 26.60],
              [127.95, 26.60],
              [127.95, 26.55]
            ]]
          }
        }
      ]
    }

    const lineGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '国道58号線' },
          geometry: {
            type: 'LineString',
            coordinates: [
              [127.6725, 26.2124],
              [127.6900, 26.3000],
              [127.7500, 26.4000],
              [127.8000, 26.5000],
              [127.8500, 26.5500]
            ]
          }
        },
        {
          type: 'Feature',
          properties: { name: '海岸ルート' },
          geometry: {
            type: 'LineString',
            coordinates: [
              [127.6500, 26.2000],
              [127.6300, 26.2500],
              [127.6200, 26.3500],
              [127.6400, 26.4500]
            ]
          }
        }
      ]
    }

    const japan = new geolonia.japan.Map({
      lngLat: [127.99866582363768, 26.47678028796848],
      zoom: 9.587623189139185,
      hash: true,
    });

    // スタイル切り替え
    document.getElementById('style-select').addEventListener('change', function (e) {
      japan.setBaseMapStyle(e.target.value);
    });

    // ハザードマップデータ名をチェックボックスとして追加する
    const hazardMapData = geolonia.japan.Map.getHazardMapData();
    const hazardCheckboxList = document.getElementById('hazardmap-checkbox-list');
    hazardMapData.forEach(name => {
      const label = document.createElement('label');
      label.style.display = 'block';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = name;
      checkbox.addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadHazardMapData(name);
        } else {
          japan.removeHazardMapData(name);
        }
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(name));
      hazardCheckboxList.appendChild(label);
    });

    // 国土数値情報データ名をチェックボックスとして追加
    const nlniData = geolonia.japan.Map.getNLNIData();
    const nlniCheckboxList = document.getElementById('nlni-checkbox-list');
    nlniData.forEach(name => {
      const label = document.createElement('label');
      label.style.display = 'block';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = name;
      checkbox.addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadNLNIData(name);
        } else {
          japan.removeNLNIData(name);
        }
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(name));
      nlniCheckboxList.appendChild(label);
    });

    // 鳥取県スマートシティデータのチェックボックスを生成（非同期）
    async function initTottoriDataCheckboxes() {
      const entries = await geolonia.japan.Map.getTottoriData();
      const container = document.getElementById('tottori-checkbox-list');
      const searchInput = document.getElementById('tottori-search');

      function renderList(filter) {
        // チェック済みの ID を保持
        const checked = new Set(
          Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value)
        );
        container.innerHTML = '';
        const filtered = filter
          ? entries.filter(e => e.description.includes(filter) || e.id.includes(filter))
          : entries;
        filtered.forEach(entry => {
          const label = document.createElement('label');
          label.style.display = 'block';
          label.style.fontSize = '12px';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = entry.id;
          if (checked.has(entry.id)) checkbox.checked = true;
          checkbox.addEventListener('change', function (e) {
            if (e.target.checked) {
              japan.loadTottoriData(entry.id);
            } else {
              japan.removeTottoriData(entry.id);
            }
          });
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(entry.description || entry.id));
          container.appendChild(label);
        });
      }

      renderList('');
      searchInput.addEventListener('input', function (e) {
        renderList(e.target.value);
      });
    }
    initTottoriDataCheckboxes();

    japan.on('load', () => {
  // 都道府県・市区町村プルダウン初期化
  initPrefCityDropdown();
      // csvデータの読み込み
      const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSv5OOG_biAGX5Q2XXrBPEtfthDNmFFtwPd50wCRON4aphbQMPHUWXtvzZ7UUjOFGhmNSv3h_jE-tyu/pub?gid=2058114753&single=true&output=csv'
      japan.loadCSV(url, '選挙時投票所一覧', {
        'marker-color': '#eba037'
      });
    console.log('style:', japan.getStyle());

      // geojsonの読み込み
      japan.loadGeojson(geojson, 'cafe', {
        'marker-symbol': 'chizubouken-lab:cafe',
        'title': ['get', 'name']
      });

      japan.loadGeojson(
        {
          "type": "FeatureCollection",
          "features": [
            {
              "type": "Feature",
              "properties": {
                "name": "那覇市役所",
                "category": "公共施設"
              },
              "geometry": {
                "type": "Point",
                "coordinates": [127.6792, 26.2124]
              }
            }
          ]
        },
        "役所",
        {
          "marker-symbol": "chizubouken-lab:castle",
          "title": ["get", "name"],
          "sprite-sheet": "chizubouken-lab"
        }
      )

      // Circle GeoJSON
      japan.loadGeojson(circleGeojson, 'sample-circle', {
        'marker-color': '#FF0000'
      });

      // Polygon GeoJSON
      japan.loadGeojson(polygonGeojson, 'sample-polygon', {});

      // Line GeoJSON
      japan.loadGeojson(lineGeojson, 'sample-line', {});

      // osmのpoiを表示
      japan.loadOsmPoi('restaurant', 'chizubouken-lab');
      document.getElementById('poi-checkbox').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('restaurant', 'chizubouken-lab');
        } else {
          const res = japan.removeOsmPoi('restaurant');
        }
      });

      japan.loadOsmPoi('鉄道', 'basic');
      document.getElementById('poi-checkbox2').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('鉄道', 'basic');
        } else {
          const res = japan.removeOsmPoi('鉄道');
        }
      });

      japan.loadOsmPoi('学校', 'basic');
      document.getElementById('poi-checkbox3').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('学校', 'basic');
        } else {
          const res = japan.removeOsmPoi('学校');
          console.log('学校のPOIを削除:', res);
        }
      });

      japan.loadOsmPoi('動物園', 'chizubouken-lab');
      document.getElementById('poi-checkbox4').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('動物園', 'chizubouken-lab');
        } else {
          japan.removeOsmPoi('動物園');
        }
      });


      // スタイル切り替え
      document.getElementById('school-sprite-select').addEventListener('change', function (e) {
        const schoolLayerIds = japan.hasLayer('学校');
        if (schoolLayerIds.length > 0) {
          schoolLayerIds.forEach(layerId => {
            japan.changeSpriteSheet(layerId, e.target.value);
          });
        }
      });


      // スタイル切り替え
      document.getElementById('zoo-icon-select').addEventListener('change', function (e) {
        const zooLayerIds = japan.hasLayer('動物園');
        if (zooLayerIds.length > 0) {
          zooLayerIds.forEach(layerId => {
            japan.changeLayerIcon(layerId, e.target.value, 'chizubouken-lab');
          });
        }
      });

      // setSymbolIconSize
      document.getElementById('symbol-size').addEventListener('input', function (e) {
        const size = parseFloat(e.target.value);
        document.getElementById('symbol-size-val').textContent = size;
        japan.setSymbolIconSize('cafe', size);
      });

      // setCircleStyle
      function updateCircleStyle() {
        japan.setCircleStyle('sample-circle', {
          color: document.getElementById('circle-color').value,
          radius: parseFloat(document.getElementById('circle-radius').value),
          strokeColor: document.getElementById('circle-stroke-color').value,
          strokeWidth: parseFloat(document.getElementById('circle-stroke-width').value),
          opacity: parseFloat(document.getElementById('circle-opacity').value)
        });
      }
      document.getElementById('circle-color').addEventListener('input', updateCircleStyle);
      document.getElementById('circle-radius').addEventListener('input', function (e) {
        document.getElementById('circle-radius-val').textContent = e.target.value;
        updateCircleStyle();
      });
      document.getElementById('circle-stroke-color').addEventListener('input', updateCircleStyle);
      document.getElementById('circle-stroke-width').addEventListener('input', function (e) {
        document.getElementById('circle-stroke-width-val').textContent = e.target.value;
        updateCircleStyle();
      });
      document.getElementById('circle-opacity').addEventListener('input', function (e) {
        document.getElementById('circle-opacity-val').textContent = e.target.value;
        updateCircleStyle();
      });

      // setFillStyle
      function updateFillStyle() {
        japan.setFillStyle('sample-polygon', {
          color: document.getElementById('fill-color').value,
          opacity: parseFloat(document.getElementById('fill-opacity').value),
          outlineColor: document.getElementById('fill-outline-color').value
        });
      }
      document.getElementById('fill-color').addEventListener('input', updateFillStyle);
      document.getElementById('fill-opacity').addEventListener('input', function (e) {
        document.getElementById('fill-opacity-val').textContent = e.target.value;
        updateFillStyle();
      });
      document.getElementById('fill-outline-color').addEventListener('input', updateFillStyle);

      // setLineStyle
      function updateLineStyle() {
        japan.setLineStyle('sample-line', {
          color: document.getElementById('line-color').value,
          width: parseFloat(document.getElementById('line-width').value),
          opacity: parseFloat(document.getElementById('line-opacity').value)
        });
      }
      document.getElementById('line-color').addEventListener('input', updateLineStyle);
      document.getElementById('line-width').addEventListener('input', function (e) {
        document.getElementById('line-width-val').textContent = e.target.value;
        updateLineStyle();
      });
      document.getElementById('line-opacity').addEventListener('input', function (e) {
        document.getElementById('line-opacity-val').textContent = e.target.value;
        updateLineStyle();
      });


      japan.on('click', (e) => {
        const x = e.point.x;
        const y = e.point.y;
        const bbox = [
          [x - 10, y - 10],
          [x + 10, y + 10]
        ];

        const data = japan.getFeaturesProperties(
          [e.point.x, e.point.y],
          { firstOnly: true }
        );

        if(!data || data.length === 0) {
          console.warn('No features found at this point');
          return;
        }

        const property = data[0].properties;

        let tableHTML = "<table class='popup-table'>";
        tableHTML += "<tr><th>属性</th><th>値</th></tr>"; // ヘッダー行を追加
        for (let key in property) {
          tableHTML += `<tr><td>${key}</td><td>${property[key]}</td></tr>`;
        }
        tableHTML += "</table>";

        new geolonia.japan.Popup({
          maxWidth: '300px'
        })
          .setLngLat(e.lngLat)
          .setHTML(tableHTML)
          .addTo(japan);
      });
    })

    let is3DEnabled = false;
    const toggle3DBtn = document.getElementById('toggle-3d-btn');
    toggle3DBtn.addEventListener('click', function () {
      if (!is3DEnabled) {
        console.log('3D地形表示 ON');
        japan.show3DTerrain();
        japan.flyTo({ pitch: 60 });
        toggle3DBtn.textContent = '3D地形表示 OFF';
        is3DEnabled = true;
      } else {
        japan.hide3DTerrain();
        japan.flyTo({ pitch: 0 });
        toggle3DBtn.textContent = '3D地形表示 ON';
        is3DEnabled = false;
      }
    });

    // 標高取得ボタンのイベント
    const getElevationBtn = document.getElementById('get-elevation-btn');
    getElevationBtn.addEventListener('click', async function () {
      if (typeof japan.getElevation === 'function') {
        const center = japan.getCenter();
        const elevation = await japan.getElevation([center.lng, center.lat]);
        if (typeof elevation === 'number') {
          alert(`現在地（地図中心）の標高: ${elevation.toFixed(2)} m`);
        } else {
          alert('標高データが取得できませんでした。3D地形表示がONか確認してください。');
        }
      } else {
        alert('getElevation APIが利用できません。MapLibreのバージョンを確認してください。');
      }
    });

    // アイコン一覧表示ボタンのイベント
    document.getElementById('show-icons-btn').addEventListener('click', async function () {
      const popup = document.getElementById('icon-popup');
      // 既に表示されている場合は非表示にする
      if (popup.style.display === 'block') {
        popup.style.display = 'none';
        return;
      }
      // 例: 'chizubouken-lab' のアイコン一覧を取得
      const styles = await geolonia.japan.Map.getIconStyles('chizubouken-lab');
      let html = '<strong>chizubouken-lab のアイコン一覧</strong><br><div style="display:flex;flex-wrap:wrap;gap:12px;">';
      styles.forEach(style => {
        html += `<div style="display:inline-block;text-align:center;margin-bottom:8px;">
          <div style="width:${style.width};height:${style.height};background-image:${style.backgroundImage};background-position:${style.backgroundPosition};background-repeat:no-repeat;margin:auto;"></div>
          <div style="font-size:12px;color:#555;">${style.name}</div>
        </div>`;
      });
      html += '</div>';
      popup.innerHTML = html;
      popup.style.display = 'block';
    });
  </script>
</body>

</html>
