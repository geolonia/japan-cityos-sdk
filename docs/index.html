<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityOS 日本</title>
  <style type="text/css">
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .popup-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed
    }

    .popup-table th,
    .popup-table td {
      border: 1px solid #ddd;
      text-align: left;
      padding: 8px;
      overflow-wrap: break-word;
    }

    .popup-table th {
      background-color: #f2f2f2;
    }

    .maplibregl-popup-content {
      overflow: auto;
    }

    #sidebar {
      position: absolute;
      z-index: 10;
      top: 10px;
      left: 10px;
      width: 280px;
      height: calc(100% - 20px);
      overflow-y: auto;
      background: #fff;
      padding: 0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      box-sizing: border-box;
      font-size: 13px;
    }

    #sidebar-title {
      padding: 14px 14px 10px;
      margin: 0;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      border-bottom: 1px solid #e0e0e0;
    }

    #sidebar-content {
      padding: 8px 12px 12px;
    }

    #sidebar h2 {
      font-size: 13px;
      margin: 0;
      padding: 0;
    }

    .section {
      margin-bottom: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #f8f8f8;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      font-size: 13px;
    }

    .section-header:hover {
      background: #f0f0f0;
    }

    .section-toggle {
      font-size: 10px;
      color: #888;
      transition: transform 0.2s;
    }

    .section.collapsed .section-toggle {
      transform: rotate(-90deg);
    }

    .section.collapsed .section-body {
      display: none;
    }

    .section-body {
      padding: 8px 10px;
    }

    .section-body label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .section-body select,
    .section-body input[type="range"],
    .section-body button {
      width: 100%;
      box-sizing: border-box;
    }

    .section-body select {
      margin-bottom: 6px;
      padding: 4px;
    }

    .section-body input[type="range"] {
      margin-bottom: 6px;
    }

    .section-body input[type="color"] {
      width: 100%;
      height: 28px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px;
      margin-bottom: 6px;
      box-sizing: border-box;
    }

    .section-body input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 4px;
      padding: 4px;
    }

    .section-body button {
      padding: 6px 0;
      margin-bottom: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
      font-size: 12px;
    }

    .section-body button:hover {
      background: #f0f0f0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .checkbox-row input[type="checkbox"] {
      margin: 0;
    }

    .checkbox-row label {
      display: inline;
      margin: 0;
      font-size: 12px;
    }

    .sub-control {
      margin-left: 18px;
      margin-bottom: 6px;
    }

    .sub-control select {
      width: 100%;
      font-size: 11px;
    }

    .style-separator {
      border: none;
      border-top: 1px solid #eee;
      margin: 8px 0;
    }

    /* データ表示セクション：サブカテゴリ */
    .data-category {
      margin-bottom: 6px;
    }

    .data-category-header {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      font-size: 12px;
      font-weight: 600;
      color: #444;
    }

    .data-category-header:hover {
      color: #222;
    }

    .data-category-toggle {
      font-size: 8px;
      color: #999;
      transition: transform 0.15s;
    }

    .data-category.collapsed .data-category-toggle {
      transform: rotate(-90deg);
    }

    .data-category.collapsed .data-category-body {
      display: none;
    }

    .data-category-body {
      padding-left: 4px;
    }

    /* 場所セクション */
    .location-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 6px;
    }

    .location-row select {
      flex: 1;
      min-width: 0;
      padding: 4px;
      font-size: 12px;
    }

    .fly-to-btn {
      flex-shrink: 0;
      padding: 4px 10px !important;
      width: auto !important;
      font-size: 12px !important;
      background: #4a90d9 !important;
      color: #fff !important;
      border-color: #3a7bc8 !important;
    }

    .fly-to-btn:hover {
      background: #3a7bc8 !important;
    }

    /* 中心マーカー（十字） */
    #center-crosshair {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }

    #center-crosshair::before,
    #center-crosshair::after {
      content: '';
      position: absolute;
      background: #e74c3c;
    }

    #center-crosshair::before {
      width: 2px;
      height: 24px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #center-crosshair::after {
      width: 24px;
      height: 2px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* アイコンポップアップ */
    #icon-popup {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #fff;
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      max-width: 90vw;
      max-height: 70vh;
      overflow: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    #icon-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #icon-popup-header strong {
      font-size: 14px;
    }

    #icon-popup-close {
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
      padding: 0 4px;
      line-height: 1;
    }

    #icon-popup-close:hover {
      color: #333;
    }

    /* アクティブ状態のボタン */
    button.active {
      background: #4a90d9 !important;
      color: #fff !important;
      border-color: #3a7bc8 !important;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div id="sidebar-title">SDK Demo</div>
    <div id="sidebar-content">
      <!-- 地図設定セクション -->
      <div class="section" id="section-map-settings">
        <div class="section-header" onclick="toggleSection('section-map-settings')">
          <h2>地図設定</h2>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-body">
          <label><strong>場所</strong></label>
          <div class="location-row">
            <select id="pref-select" aria-label="都道府県"></select>
            <select id="city-select" aria-label="市区町村"></select>
            <button class="fly-to-btn" id="fly-to-btn">移動</button>

          <label for="style-select" style="margin-top:8px;"><strong>背景地図</strong></label>
          <select id="style-select">
            <option value="https://basic-v1-background-only.pages.dev/style.json">basic</option>
            <option value="https://geoloniamaps.github.io/gsi/style.json">標準</option>
            <option value="https://smartmap.styles.geoloniamaps.com/style.json">GSI</option>

          <button id="toggle-3d-btn">3D地形表示 ON</button>

      <!-- データ表示セクション -->
      <div class="section" id="section-data">
        <div class="section-header" onclick="toggleSection('section-data')">
          <h2>データ表示</h2>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-body">
          <!-- OSMデータ -->
          <div class="data-category" id="data-osm">
            <div class="data-category-header" onclick="toggleDataCategory('data-osm')">
              <span class="data-category-toggle">▼</span>
              OSMデータ
            </div>
            <div class="data-category-body" id="osm-checkbox-list"></div>
          </div>

          <!-- ハザードマップ -->
          <div class="data-category" id="data-hazard">
            <div class="data-category-header" onclick="toggleDataCategory('data-hazard')">
              <span class="data-category-toggle">▼</span>
              ハザードマップ
            </div>
            <div class="data-category-body" id="hazardmap-checkbox-list"></div>
          </div>

          <!-- 国土数値情報 -->
          <div class="data-category" id="data-nlni">
            <div class="data-category-header" onclick="toggleDataCategory('data-nlni')">
              <span class="data-category-toggle">▼</span>
              国土数値情報
            </div>
            <div class="data-category-body" id="nlni-checkbox-list"></div>
          </div>

          <!-- 鳥取県スマートシティ -->
          <div class="data-category" id="data-tottori">
            <div class="data-category-header" onclick="toggleDataCategory('data-tottori')">
              <span class="data-category-toggle">▼</span>
              鳥取県スマートシティ
            </div>
            <div class="data-category-body">
              <input type="text" id="tottori-search" placeholder="レイヤー検索...">
              <div id="tottori-checkbox-list" style="max-height:200px;overflow-y:auto;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- スタイル変更デモセクション -->
      <div class="section" id="section-style-demo">
        <div class="section-header" onclick="toggleSection('section-style-demo')">
          <h2>スタイル変更デモ</h2>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-body">
          <button id="load-sample-features-btn" style="background:#4a90d9;color:#fff;border-color:#3a7bc8;">サンプルの地物を表示する</button>

          <div id="style-controls" style="display:none;">
            <hr class="style-separator">
            <label><strong>setSymbolIconSize</strong> (cafe)</label>
            <label>icon-size: <span id="symbol-size-val">0.5</span></label>
            <input type="range" id="symbol-size" min="0.1" max="3" step="0.1" value="0.5">

            <hr class="style-separator">
            <label><strong>setCircleStyle</strong> (sample-circle)</label>
            <label>color</label>
            <input type="color" id="circle-color" value="#FF0000">
            <label>radius: <span id="circle-radius-val">6</span></label>
            <input type="range" id="circle-radius" min="1" max="30" step="1" value="6">
            <label>strokeColor</label>
            <input type="color" id="circle-stroke-color" value="#FF0000">
            <label>strokeWidth: <span id="circle-stroke-width-val">1</span></label>
            <input type="range" id="circle-stroke-width" min="0" max="10" step="1" value="1">
            <label>opacity: <span id="circle-opacity-val">0.8</span></label>
            <input type="range" id="circle-opacity" min="0" max="1" step="0.1" value="0.8">

            <hr class="style-separator">
            <label><strong>setFillStyle</strong> (sample-polygon)</label>
            <label>color</label>
            <input type="color" id="fill-color" value="#00FF00">
            <label>opacity: <span id="fill-opacity-val">0.5</span></label>
            <input type="range" id="fill-opacity" min="0" max="1" step="0.1" value="0.5">
            <label>outlineColor</label>
            <input type="color" id="fill-outline-color" value="#00FF00">

            <hr class="style-separator">
            <label><strong>setLineStyle</strong> (sample-line)</label>
            <label>color</label>
            <input type="color" id="line-color" value="#0000FF">
            <label>width: <span id="line-width-val">3</span></label>
            <input type="range" id="line-width" min="1" max="20" step="1" value="3">
            <label>opacity: <span id="line-opacity-val">1.0</span></label>
            <input type="range" id="line-opacity" min="0" max="1" step="0.1" value="1.0">
          </div>
        </div>
      </div>

      <!-- ツールセクション -->
      <div class="section" id="section-tools">
        <div class="section-header" onclick="toggleSection('section-tools')">
          <h2>ツール</h2>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-body">
          <button id="show-icons-btn">アイコン一覧表示</button>
        </div>
      </div>
    </div>

    <div id="icon-popup">
      <div id="icon-popup-header">
        <strong>chizubouken-lab のアイコン一覧</strong>
        <button id="icon-popup-close">&times;</button>
      </div>
      <div id="icon-popup-body"></div>
    </div>
  </div>

  <div id="center-crosshair"></div>
  <div id="map"></div>
  <script src="./index.js?api-key=e3b7017e263c4bb39267b11a469ba286"></script>
  <script type="application/javascript">
    // セクション折りたたみ
    function toggleSection(sectionId) {
      document.getElementById(sectionId).classList.toggle('collapsed');
    }

    // データカテゴリ折りたたみ
    function toggleDataCategory(categoryId) {
      document.getElementById(categoryId).classList.toggle('collapsed');
    }

    // 都道府県・市区町村プルダウン初期化
    async function initPrefCityDropdown() {
      const prefSelect = document.getElementById('pref-select');
      const citySelect = document.getElementById('city-select');
      const flyToBtn = document.getElementById('fly-to-btn');

      // 都道府県取得
      const prefs = await geolonia.japan.Map.fetchPrefNames();
      prefSelect.innerHTML = prefs.map(pref => `<option value="${pref}">${pref}</option>`).join('');
      // 初期選択の市区町村表示
      const firstPref = prefs[0];
      const cities = await geolonia.japan.Map.fetchCityNames(firstPref);
      citySelect.innerHTML = cities.map(city => `<option value="${city}">${city}</option>`).join('');

      // レースコンディション防止用リクエストID
      let prefRequestId = 0;
      let moveRequestId = 0;

      // 都道府県変更時：市区町村を更新（移動しない）
      prefSelect.addEventListener('change', async function(e) {
        const prefName = e.target.value;
        const reqId = ++prefRequestId;
        citySelect.innerHTML = '';
        flyToBtn.disabled = true;
        try {
          const cities = await geolonia.japan.Map.fetchCityNames(prefName);
          if (reqId !== prefRequestId) return;
          citySelect.innerHTML = cities.map(city => `<option value="${city}">${city}</option>`).join('');
          flyToBtn.disabled = cities.length === 0;
        } catch (err) {
          if (reqId === prefRequestId) flyToBtn.disabled = false;
          console.error('市区町村一覧の取得に失敗:', err);
        }
      });

      // 移動ボタン：選択中の市区町村に移動
      let isFlying = false;
      flyToBtn.addEventListener('click', async function() {
        if (isFlying) return;
        const prefName = prefSelect.value;
        const cityName = citySelect.value;
        if (!cityName) return;
        isFlying = true;
        flyToBtn.disabled = true;
        try {
          const reqId = ++moveRequestId;
          const lngLat = await geolonia.japan.Map.getLatLngByCity(prefName, cityName);
          if (reqId !== moveRequestId || prefName !== prefSelect.value || cityName !== citySelect.value) return;
          if (lngLat) {
            japan.flyTo({ center: lngLat, zoom: 13 });
          }
        } catch (err) {
          console.error('座標の取得に失敗:', err);
        } finally {
          isFlying = false;
          flyToBtn.disabled = false;
        }
      });
    }

    // サンプル GeoJSON データ
    const geojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: {
            name: 'やんばるHotCafe',
            price: '¥1,000〜2,000',
            category: 'レストラン'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98946107360247, 26.67593043421343]
          }
        },
        {
          type: 'Feature',
          properties: {
            name: '森の巣箱',
            price: '¥1,000〜2,000',
            category: 'カフェ・喫茶'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98748696778947, 26.661740999954894]
          }
        }
      ]
    }

    const circleGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '那覇空港' },
          geometry: { type: 'Point', coordinates: [127.6461, 26.2076] }
        },
        {
          type: 'Feature',
          properties: { name: '首里城' },
          geometry: { type: 'Point', coordinates: [127.7195, 26.2172] }
        },
        {
          type: 'Feature',
          properties: { name: '美ら海水族館' },
          geometry: { type: 'Point', coordinates: [127.8779, 26.6944] }
        },
        {
          type: 'Feature',
          properties: { name: '万座毛' },
          geometry: { type: 'Point', coordinates: [127.8547, 26.5041] }
        }
      ]
    }

    const polygonGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '那覇エリア' },
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [127.65, 26.20],
              [127.72, 26.20],
              [127.72, 26.25],
              [127.65, 26.25],
              [127.65, 26.20]
            ]]
          }
        },
        {
          type: 'Feature',
          properties: { name: '名護エリア' },
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [127.95, 26.55],
              [128.02, 26.55],
              [128.02, 26.60],
              [127.95, 26.60],
              [127.95, 26.55]
            ]]
          }
        }
      ]
    }

    const lineGeojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: '国道58号線' },
          geometry: {
            type: 'LineString',
            coordinates: [
              [127.6725, 26.2124],
              [127.6900, 26.3000],
              [127.7500, 26.4000],
              [127.8000, 26.5000],
              [127.8500, 26.5500]
            ]
          }
        },
        {
          type: 'Feature',
          properties: { name: '海岸ルート' },
          geometry: {
            type: 'LineString',
            coordinates: [
              [127.6500, 26.2000],
              [127.6300, 26.2500],
              [127.6200, 26.3500],
              [127.6400, 26.4500]
            ]
          }
        }
      ]
    }

    // APIキーを環境変数またはURLパラメータから取得
    const apiKey =
      window.geolonia?.API_KEY ||
      new URLSearchParams(window.location.search).get('apiKey') ||
      'YOUR_API_KEY'; // デフォルト値（実運用では必ず実際のキーに置き換えてください）

    if (!apiKey || apiKey === 'YOUR_API_KEY') {
      console.warn('Geolonia APIキーを設定してください（window.geolonia.API_KEY または ?apiKey= パラメータ）');
    }

    const japan = new geolonia.japan.Map({
      apiKey,
      lngLat: [127.99866582363768, 26.47678028796848],
      zoom: 9.587623189139185,
      hash: true,
    });

    // スタイル切り替え
    document.getElementById('style-select').addEventListener('change', function (e) {
      japan.setBaseMapStyle(e.target.value);
    });

    // OSMデータのチェックボックスを動的生成
    const osmNames = geolonia.japan.Map.getOsmPoiLayers();
    const osmCheckboxList = document.getElementById('osm-checkbox-list');
    osmNames.forEach(name => {
      const row = document.createElement('div');
      row.className = 'checkbox-row';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'osm-' + name;
      checkbox.value = name;
      checkbox.addEventListener('change', function(e) {
        if (e.target.checked) {
          japan.loadOsmPoi(name, 'chizubouken-lab');
        } else {
          japan.removeOsmPoi(name);
        }
      });
      const label = document.createElement('label');
      label.htmlFor = checkbox.id;
      label.textContent = name;
      row.appendChild(checkbox);
      row.appendChild(label);
      osmCheckboxList.appendChild(row);
    });

    // ハザードマップデータ名をチェックボックスとして追加する
    const hazardMapData = geolonia.japan.Map.getHazardMapData();
    const hazardCheckboxList = document.getElementById('hazardmap-checkbox-list');
    hazardMapData.forEach(name => {
      const row = document.createElement('div');
      row.className = 'checkbox-row';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'hazard-' + name;
      checkbox.value = name;
      checkbox.addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadHazardMapData(name);
        } else {
          japan.removeHazardMapData(name);
        }
      });
      const label = document.createElement('label');
      label.htmlFor = checkbox.id;
      label.textContent = name;
      row.appendChild(checkbox);
      row.appendChild(label);
      hazardCheckboxList.appendChild(row);
    });

    // 国土数値情報データ名をチェックボックスとして追加
    const nlniData = geolonia.japan.Map.getNLNIData();
    const nlniCheckboxList = document.getElementById('nlni-checkbox-list');
    nlniData.forEach(name => {
      const row = document.createElement('div');
      row.className = 'checkbox-row';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'nlni-' + name;
      checkbox.value = name;
      checkbox.addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadNLNIData(name);
        } else {
          japan.removeNLNIData(name);
        }
      });
      const label = document.createElement('label');
      label.htmlFor = checkbox.id;
      label.textContent = name;
      row.appendChild(checkbox);
      row.appendChild(label);
      nlniCheckboxList.appendChild(row);
    });

    // 鳥取県スマートシティデータのチェックボックスを生成（非同期）
    async function initTottoriDataCheckboxes() {
      let entries;
      try {
        entries = await geolonia.japan.Map.getTottoriData();
      } catch (err) {
        console.error('鳥取県データの取得に失敗:', err);
        return;
      }
      const container = document.getElementById('tottori-checkbox-list');
      const searchInput = document.getElementById('tottori-search');

      function renderList(filter) {
        const checked = new Set(
          Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value)
        );
        container.innerHTML = '';
        const filtered = filter
          ? entries.filter(e => {
              const lowerFilter = filter.toLowerCase();
              return (e.description || '').toLowerCase().includes(lowerFilter) ||
                     e.id.toLowerCase().includes(lowerFilter);
            })
          : entries;
        filtered.forEach(entry => {
          const row = document.createElement('div');
          row.className = 'checkbox-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = entry.id;
          if (checked.has(entry.id)) checkbox.checked = true;
          checkbox.addEventListener('change', function (e) {
            if (e.target.checked) {
              japan.loadTottoriData(entry.id).catch(err => {
                console.error('レイヤーの読み込みに失敗:', err);
                e.target.checked = false;
              });
            } else {
              japan.removeTottoriData(entry.id).catch(err => {
                console.error('レイヤーの削除に失敗:', err);
                e.target.checked = true;
              });
            }
          });
          const label = document.createElement('label');
          label.textContent = entry.description || entry.id;
          row.appendChild(checkbox);
          row.appendChild(label);
          container.appendChild(row);
        });
      }

      renderList('');
      searchInput.addEventListener('input', function (e) {
        renderList(e.target.value);
      });
    }
    initTottoriDataCheckboxes();

    // サンプル地物の読み込み状態
    let sampleFeaturesLoaded = false;

    japan.on('load', () => {
      // 都道府県・市区町村プルダウン初期化
      initPrefCityDropdown();

      // csvデータの読み込み
      const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSv5OOG_biAGX5Q2XXrBPEtfthDNmFFtwPd50wCRON4aphbQMPHUWXtvzZ7UUjOFGhmNSv3h_jE-tyu/pub?gid=2058114753&single=true&output=csv'
      japan.loadCSV(url, '選挙時投票所一覧', {
        'marker-color': '#eba037'
      });
      // geojsonの読み込み
      japan.loadGeojson(geojson, 'cafe', {
        'marker-symbol': 'chizubouken-lab:cafe',
        'title': ['get', 'name']
      });

      japan.loadGeojson(
        {
          "type": "FeatureCollection",
          "features": [
            {
              "type": "Feature",
              "properties": {
                "name": "那覇市役所",
                "category": "公共施設"
              },
              "geometry": {
                "type": "Point",
                "coordinates": [127.6792, 26.2124]
              }
            }
          ]
        },
        "役所",
        {
          "marker-symbol": "chizubouken-lab:castle",
          "title": ["get", "name"],
          "sprite-sheet": "chizubouken-lab"
        }
      )

      // サンプル地物を表示するボタン（トグル）
      document.getElementById('load-sample-features-btn').addEventListener('click', function () {
        const btn = this;
        if (!sampleFeaturesLoaded) {
          // 表示
          try {
            japan.loadGeojson(circleGeojson, 'sample-circle', { 'marker-color': '#FF0000' });
            japan.loadGeojson(polygonGeojson, 'sample-polygon', {});
            japan.loadGeojson(lineGeojson, 'sample-line', {});
          } catch (err) {
            console.error('サンプル地物の読み込みに失敗:', err);
            return;
          }
          // 現在のコントロール値でスタイルを再適用
          updateCircleStyle();
          updateFillStyle();
          updateLineStyle();
          document.getElementById('style-controls').style.display = 'block';
          btn.textContent = 'サンプルの地物を非表示にする';
          btn.style.background = '#e74c3c';
          btn.style.borderColor = '#c0392b';
          sampleFeaturesLoaded = true;
        } else {
          // 非表示
          try {
            japan.removeGeojsonLayer('sample-circle');
            japan.removeGeojsonLayer('sample-polygon');
            japan.removeGeojsonLayer('sample-line');
          } catch (err) {
            console.error('サンプル地物の削除に失敗:', err);
            return;
          }
          document.getElementById('style-controls').style.display = 'none';
          btn.textContent = 'サンプルの地物を表示する';
          btn.style.background = '#4a90d9';
          btn.style.borderColor = '#3a7bc8';
          sampleFeaturesLoaded = false;
        }
      });

      // setSymbolIconSize
      document.getElementById('symbol-size').addEventListener('input', function (e) {
        const size = parseFloat(e.target.value);
        document.getElementById('symbol-size-val').textContent = size;
        japan.setSymbolIconSize('cafe', size);
      });

      // setCircleStyle
      function updateCircleStyle() {
        japan.setCircleStyle('sample-circle', {
          color: document.getElementById('circle-color').value,
          radius: parseFloat(document.getElementById('circle-radius').value),
          strokeColor: document.getElementById('circle-stroke-color').value,
          strokeWidth: parseFloat(document.getElementById('circle-stroke-width').value),
          opacity: parseFloat(document.getElementById('circle-opacity').value)
        });
      }
      document.getElementById('circle-color').addEventListener('input', updateCircleStyle);
      document.getElementById('circle-radius').addEventListener('input', function (e) {
        document.getElementById('circle-radius-val').textContent = e.target.value;
        updateCircleStyle();
      });
      document.getElementById('circle-stroke-color').addEventListener('input', updateCircleStyle);
      document.getElementById('circle-stroke-width').addEventListener('input', function (e) {
        document.getElementById('circle-stroke-width-val').textContent = e.target.value;
        updateCircleStyle();
      });
      document.getElementById('circle-opacity').addEventListener('input', function (e) {
        document.getElementById('circle-opacity-val').textContent = e.target.value;
        updateCircleStyle();
      });
      // UI初期値をロード直後のレイヤーに反映
      updateCircleStyle();

      // setFillStyle
      function updateFillStyle() {
        japan.setFillStyle('sample-polygon', {
          color: document.getElementById('fill-color').value,
          opacity: parseFloat(document.getElementById('fill-opacity').value),
          outlineColor: document.getElementById('fill-outline-color').value
        });
      }
      document.getElementById('fill-color').addEventListener('input', updateFillStyle);
      document.getElementById('fill-opacity').addEventListener('input', function (e) {
        document.getElementById('fill-opacity-val').textContent = e.target.value;
        updateFillStyle();
      });
      document.getElementById('fill-outline-color').addEventListener('input', updateFillStyle);
      // UI初期値をロード直後のレイヤーに反映
      updateFillStyle();

      // setLineStyle
      function updateLineStyle() {
        japan.setLineStyle('sample-line', {
          color: document.getElementById('line-color').value,
          width: parseFloat(document.getElementById('line-width').value),
          opacity: parseFloat(document.getElementById('line-opacity').value)
        });
      }
      document.getElementById('line-color').addEventListener('input', updateLineStyle);
      document.getElementById('line-width').addEventListener('input', function (e) {
        document.getElementById('line-width-val').textContent = e.target.value;
        updateLineStyle();
      });
      document.getElementById('line-opacity').addEventListener('input', function (e) {
        document.getElementById('line-opacity-val').textContent = e.target.value;
        updateLineStyle();
      });
      // UI初期値をロード直後のレイヤーに反映
      updateLineStyle();

      japan.on('click', (e) => {
        const x = e.point.x;
        const y = e.point.y;
        const bbox = [
          [x - 10, y - 10],
          [x + 10, y + 10]
        ];

        const data = japan.getFeaturesProperties(
          [e.point.x, e.point.y],
          { firstOnly: true }
        );

        if(!data || data.length === 0) {
          console.warn('No features found at this point');
          return;
        }

        const property = data[0].properties;

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        let tableHTML = "<table class='popup-table'>";
        tableHTML += "<tr><th>属性</th><th>値</th></tr>";
        for (const [key, value] of Object.entries(property)) {
          tableHTML += `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`;
        }
        tableHTML += "</table>";

        new geolonia.japan.Popup({
          maxWidth: '300px'
        })
          .setLngLat(e.lngLat)
          .setHTML(tableHTML)
          .addTo(japan);
      });
    })

    let is3DEnabled = false;
    const toggle3DBtn = document.getElementById('toggle-3d-btn');
    toggle3DBtn.addEventListener('click', function () {
      if (!is3DEnabled) {
        japan.show3DTerrain();
        japan.flyTo({ pitch: 60 });
        toggle3DBtn.textContent = '3D地形表示 OFF';
        is3DEnabled = true;
      } else {
        japan.hide3DTerrain();
        japan.flyTo({ pitch: 0 });
        toggle3DBtn.textContent = '3D地形表示 ON';
        is3DEnabled = false;
      }
    });

    // 標高取得ボタンのイベント
    const getElevationBtn = document.getElementById('get-elevation-btn');
    const centerCrosshair = document.getElementById('center-crosshair');
    let elevationPopup = null;
    let elevationRequestId = 0;

    function showElevationPopup(center, html) {
      if (elevationPopup) elevationPopup.remove();
      elevationPopup = new geolonia.japan.Popup({ closeOnClick: false, maxWidth: '200px' })
        .setLngLat([center.lng, center.lat])
        .setHTML(html)
        .addTo(japan);
      elevationPopup.on('close', function() {
        centerCrosshair.style.display = 'none';
        elevationPopup = null;
      });
    }

    getElevationBtn.addEventListener('click', async function () {
      centerCrosshair.style.display = 'block';

      if (typeof japan.getElevation !== 'function') {
        centerCrosshair.style.display = 'none';
        return;
      }

      const center = japan.getCenter();
      const reqId = ++elevationRequestId;
      let elevation;
      try {
        elevation = await japan.getElevation([center.lng, center.lat]);
      } catch (err) {
        if (reqId === elevationRequestId) centerCrosshair.style.display = 'none';
        console.error('標高データの取得に失敗:', err);
        return;
      }
      if (reqId !== elevationRequestId) return;

      if (typeof elevation === 'number') {
        showElevationPopup(center, `<div style="text-align:center;padding:4px;font-size:13px;">ここの標高は<br><strong style="font-size:18px;">${elevation.toFixed(2)} m</strong></div>`);
      } else {
        showElevationPopup(center, '<div style="text-align:center;padding:4px;font-size:13px;">標高データが取得できませんでした。<br>3D地形表示がONか確認してください。</div>');
      }
    });

    // アイコン一覧表示ボタンのイベント
    const showIconsBtn = document.getElementById('show-icons-btn');
    const iconPopup = document.getElementById('icon-popup');
    const iconPopupBody = document.getElementById('icon-popup-body');
    const iconPopupClose = document.getElementById('icon-popup-close');

    showIconsBtn.addEventListener('click', async function () {
      if (iconPopup.style.display === 'block') {
        iconPopup.style.display = 'none';
        showIconsBtn.textContent = 'アイコン一覧表示';
        showIconsBtn.classList.remove('active');
        return;
      }
      const styles = await geolonia.japan.Map.getIconStyles('chizubouken-lab');
      let html = '<div style="display:flex;flex-wrap:wrap;gap:12px;">';
      styles.forEach(style => {
        html += `<div style="display:inline-block;text-align:center;margin-bottom:8px;">
          <div style="width:${style.width};height:${style.height};background-image:${style.backgroundImage};background-position:${style.backgroundPosition};background-repeat:no-repeat;margin:auto;"></div>
          <div style="font-size:12px;color:#555;">${style.name}</div>
        </div>`;
      });
      html += '</div>';
      iconPopupBody.innerHTML = html;
      iconPopup.style.display = 'block';
      showIconsBtn.textContent = 'アイコン一覧を非表示';
      showIconsBtn.classList.add('active');
    });

    // ポップアップのバツボタン
    iconPopupClose.addEventListener('click', function() {
      iconPopup.style.display = 'none';
      showIconsBtn.textContent = 'アイコン一覧表示';
      showIconsBtn.classList.remove('active');
    });
  </script>
</body>

</html>
