<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityOS 日本</title>
  <style type="text/css">
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .popup-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed
    }

    .popup-table th,
    .popup-table td {
      border: 1px solid #ddd;
      text-align: left;
      padding: 8px;
      overflow-wrap: break-word;
    }

    .popup-table th {
      background-color: #f2f2f2;
    }

    .maplibregl-popup-content {
      overflow: auto;
    }
  </style>
</head>

<body>
  <div style="position:absolute;z-index:10;top:10px;left:10px;">
    <select id="style-select">
      <option value="https://basic-v1-background-only.pages.dev/style.json">basic</option>
      <option value="https://geoloniamaps.github.io/gsi/style.json">標準</option>
      <option value="https://smartmap.styles.geoloniamaps.com/style.json">GSI</option>
      <option value="https://smartcity-satellite.styles.geoloniamaps.com/style.json">衛星写真</option>
      <option value="https://chizubouken-lab.pages.dev/rpg-style.json">ゲーム風</option>
    </select>
  </div>
  <div style="position:absolute;z-index:10;top:40px;left:10px;">
    <input type="checkbox" id="poi-checkbox" checked>
    <label for="poi-checkbox">OSM：レストラン</label>
  </div>
  <div style="position:absolute;z-index:10;top:72px;left:10px;">
    <input type="checkbox" id="poi-checkbox2" checked>
    <label for="poi-checkbox2">OSM：鉄道</label>
  </div>
  <div style="position:absolute;z-index:10;top:104px;left:10px;">
    <input type="checkbox" id="poi-checkbox3" checked>
    <label for="poi-checkbox3">OSM：学校</label>
  </div>
  <div style="position:absolute;z-index:10;top:136px;left:10px;">
    <select id="school-sprite-select">
      <option value="basic" default>学校を'basic'スプライトで表示</option>
      <option value="chizubouken-lab">学校を'chizubouken-lab'スプライトで表示</option>
    </select>
  </div>
  <div style="position:absolute;z-index:10;top:168px;left:10px;">
    <input type="checkbox" id="poi-checkbox4" checked>
    <label for="poi-checkbox4">OSM：zoo</label>
  </div>
  <div style="position:absolute;z-index:10;top:200px;left:10px;">
    <select id="zoo-icon-select">
      <option value="zoo" default>動物園を'動物園'アイコンで表示</option>
      <option value="castle">動物園を'城'アイコンで表示</option>
    </select>
  </div>
  <div id="map"></div>
  <script src="./index.js"></script>
  <script type="application/javascript">

    const geojson = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: {
            name: 'やんばるHotCafe',
            price: '¥1,000〜2,000',
            category: 'レストラン'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98946107360247, 26.67593043421343]
          }
        },
        {
          type: 'Feature',
          properties: {
            name: '森の巣箱',
            price: '¥1,000〜2,000',
            category: 'カフェ・喫茶'
          },
          geometry: {
            type: 'Point',
            coordinates: [127.98748696778947, 26.661740999954894]
          }
        }
      ]
    }

    const japan = new geolonia.japan.Map({
      lngLat: [127.99866582363768, 26.47678028796848],
      zoom: 9.587623189139185,
      hash: true,
    });

    // スタイル切り替え
    document.getElementById('style-select').addEventListener('change', function (e) {
      japan.setBaseMapStyle(e.target.value);
    });

    japan.on('load', () => {
      // csvデータの読み込み
      const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSv5OOG_biAGX5Q2XXrBPEtfthDNmFFtwPd50wCRON4aphbQMPHUWXtvzZ7UUjOFGhmNSv3h_jE-tyu/pub?gid=2058114753&single=true&output=csv'
      japan.loadCSV(url, '選挙時投票所一覧', {
        'marker-color': '#eba037'
      });

      // geojsonの読み込み
      japan.loadGeojson(geojson, 'restaurant', {
        'marker-symbol': 'marker:restaurant',
        'title': ['get', 'name']
      });

      japan.loadGeojson(
        {
          "type": "FeatureCollection",
          "features": [
            {
              "type": "Feature",
              "properties": {
                "name": "那覇市役所",
                "category": "公共施設"
              },
              "geometry": {
                "type": "Point",
                "coordinates": [127.6792, 26.2124]
              }
            }
          ]
        },
        "役所",
        {
          "marker-symbol": "chizubouken-lab:castle",
          "title": ["get", "name"],
          "sprite-sheet": "chizubouken-lab"
        }
      )

      // osmのpoiを表示
      japan.loadOsmPoi('restaurant', 'chizubouken-lab');
      document.getElementById('poi-checkbox').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('restaurant', 'chizubouken-lab');
        } else {
          const res = japan.removeOsmPoi('restaurant');
          console.log('レストランのPOIを削除:', res);
        }
      });

      japan.loadOsmPoi('鉄道', 'basic');
      document.getElementById('poi-checkbox2').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('鉄道', 'basic');
        } else {
          const res = japan.removeOsmPoi('鉄道');
          console.log('鉄道のPOIを削除:', res);
        }
      });

      japan.loadOsmPoi('学校', 'basic');
      document.getElementById('poi-checkbox3').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('学校', 'basic');
        } else {
          const res = japan.removeOsmPoi('学校');
          console.log('学校のPOIを削除:', res);
        }
      });

      japan.loadOsmPoi('動物園', 'chizubouken-lab');
      document.getElementById('poi-checkbox4').addEventListener('change', function (e) {
        if (e.target.checked) {
          japan.loadOsmPoi('動物園', 'chizubouken-lab');
        } else {
          japan.removeOsmPoi('動物園');
        }
      });


      // スタイル切り替え
      document.getElementById('school-sprite-select').addEventListener('change', function (e) {
        const schoolLayerIds = japan.hasLayer('学校');
        if(schoolLayerIds.length > 0) {
          schoolLayerIds.forEach(layerId => {
            japan.changeSpriteSheet(layerId, e.target.value);
          });
        }
      });


      // スタイル切り替え
      document.getElementById('zoo-icon-select').addEventListener('change', function (e) {
        const zooLayerIds = japan.hasLayer('動物園');
        if(zooLayerIds.length > 0) {
          zooLayerIds.forEach(layerId => {
            japan.changeLayerIcon(layerId, e.target.value, 'chizubouken-lab');
          });
        }
      });

      japan.on('click', (e) => {
        const hasFeature = japan.hasFeature([e.point.x, e.point.y], ['restaurant', '選挙時投票所一覧']);
        const features = japan.getFeatures([e.point.x, e.point.y], ['restaurant', '選挙時投票所一覧']);

        const x = e.point.x;
        const y = e.point.y;
        const bbox = [
          [x - 10, y - 10],
          [x + 10, y + 10]
        ];
        const hasBboxFeature = japan.hasFeature(bbox, ['restaurant', '選挙時投票所一覧']);
        const bboxFeatures = japan.getFeatures(bbox, ['restaurant', '選挙時投票所一覧']);

        if(!hasFeature) { return; }

        const properties = features[0].properties;

        let tableHTML = "<table class='popup-table'>";
        tableHTML += "<tr><th>属性</th><th>値</th></tr>"; // ヘッダー行を追加
        for (let key in properties) {
          tableHTML += `<tr><td>${key}</td><td>${properties[key]}</td></tr>`;
        }
        tableHTML += "</table>";

        new geolonia.japan.Popup({
          maxWidth: '300px'
        })
          .setLngLat(e.lngLat)
          .setHTML(tableHTML)
          .addTo(japan);
      });
    })
  </script>
</body>

</html>
